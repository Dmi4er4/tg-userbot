services:
  # Renderer for the .q command. The public instance (bot.lyo.su) is unreliable,
  # so we build LyoSU/quote-api locally and talk to it over the host network.
  quote-api:
    build: https://github.com/LyoSU/quote-api.git
    platform: linux/amd64
    container_name: quote-api
    network_mode: host
    environment:
      - NODE_ENV=production
      # 3000 is taken by AdGuard on the host network; keep this in sync
      # with QUOTE_API_URL.
      - PORT=3100
    # The image's own healthcheck is hardcoded to 3000; override it.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  dmi4er4-userbot:
    build: .
    platform: linux/amd64
    container_name: dmi4er4-userbot
    network_mode: host
    env_file:
      - .env.dmi4er4
    volumes:
      - ./cookies:/app/cookies
    restart: unless-stopped

  taak-userbot:
    build: .
    platform: linux/amd64
    container_name: taak-userbot
    network_mode: host
    env_file:
      - .env.taak
    volumes:
      - ./cookies:/app/cookies
    restart: unless-stopped

  charndv-userbot:
    build: .
    platform: linux/amd64
    container_name: charndv-userbot
    network_mode: host
    env_file:
      - .env.charndv
    volumes:
      - ./cookies:/app/cookies
    restart: unless-stopped
